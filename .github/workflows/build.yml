name: بناء تطبيق أندرويد

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت الحزم
        run: npm install --no-audit --no-fund

      - name: إنشاء مشروع أندرويد
        run: |
          npx cap add android
          # صلاحية الإنترنت
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml || sed -i "s|<application|<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application|" android/app/src/main/AndroidManifest.xml

      - name: الأيقونة وشاشة البداية
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#3D7BF4" --splashBackgroundColor "#F6F7FB" --splashBackgroundColorDark "#0B1020"

      - name: رقم الإصدار
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: مزامنة
        run: npx cap sync android

      - name: بناء APK للتجربة
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: بناء نسخة النشر (عند وجود مفتاح التوقيع)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: توقيع نسخة النشر
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" --ks-key-alias "${{ secrets.KEY_ALIAS }}" --key-pass "pass:${{ secrets.KEY_PASSWORD }}" --out banee-release.apk app-release-aligned.apk
          jarsigner -keystore release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" android/app/build/outputs/bundle/release/app-release.aab "${{ secrets.KEY_ALIAS }}"
          cp android/app/build/outputs/bundle/release/app-release.aab banee-release.aab
          rm -f release.jks

      - name: تجهيز الملفات
        run: cp android/app/build/outputs/apk/debug/app-debug.apk banee-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: banee-v1.0.${{ github.run_number }}
          path: |
            banee-*.apk
            banee-*.aab

      - name: نشر إصدار بالتحميل المباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "بانِي v1.0.${{ github.run_number }}"
          files: |
            banee-*.apk
            banee-*.aab
