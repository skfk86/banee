name: APK سحابي

# يُشغَّل من خادم بانِي (repository_dispatch) لكل طلب «ابنِ APK» من المستخدم.
# الأمان: لا نشغّل أي سكربت من ملف المستخدم. نأخذ منه فقط www/index.html والصور، ومعرّف التطبيق واسمه بعد التحقق،
# ونبني بـ package.json ثابت هنا. مهمة البناء بلا صلاحية كتابة؛ النشر في مهمة منفصلة لا ترى ملفات المستخدم إلا الـ APK.
on:
  repository_dispatch:
    types: [apk]

run-name: apk ${{ github.event.client_payload.id }}

permissions:
  contents: read

concurrency:
  group: apk-${{ github.event.client_payload.id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: جلب ملفات التطبيق
        env:
          ID: ${{ github.event.client_payload.id }}
          MODE: ${{ github.event.client_payload.mode }}
          K: ${{ github.event.client_payload.k }}
        run: |
          echo "$ID" | grep -Eq '^[a-zA-Z0-9]{20}$' || { echo "bad id"; exit 1; }
          # مفتاح تشفير ملف التوقيع: لا يظهر في السجل أبداً
          if [ "$MODE" = "store" ]; then echo "$K" | grep -Eq '^[0-9a-f]{64}$' || { echo "bad key"; exit 1; }; echo "::add-mask::$K"; echo "STORE=1" >> "$GITHUB_ENV"; fi
          mkdir -p in && cd in
          BASE="https://firestore.googleapis.com/v1/projects/bani-b28a0/databases/(default)/documents/apk/$ID"
          curl -sf "$BASE" -o meta.json
          N=$(jq -r '.fields.parts.integerValue // "0"' meta.json)
          [ "$N" -ge 1 ] && [ "$N" -le 60 ] || { echo "bad parts"; exit 1; }
          : > b64
          for i in $(seq 0 $((N-1))); do curl -sf "$BASE/parts/$i" | jq -jr '.fields.d.stringValue' >> b64; done
          base64 -d b64 > app.zip
          ls -la app.zip
          AD=$(jq -r '.fields.admob.stringValue // ""' meta.json)
          echo "$AD" | grep -Eq '^ca-app-pub-[0-9]+~[0-9]+$' || AD=ca-app-pub-3940256099942544~3347511713
          echo "ADMOB=$AD" >> "$GITHUB_ENV"
          VC=$(jq -r '.fields.vc.integerValue // "1"' meta.json); echo "$VC" | grep -Eq '^[0-9]{1,6}$' || VC=1
          VN=$(jq -r '.fields.vn.stringValue // "1.0"' meta.json); echo "$VN" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){0,2}$' || VN=1.0
          echo "VC=$VC" >> "$GITHUB_ENV"; echo "VN=$VN" >> "$GITHUB_ENV"
          jq -r '.fields.kb.stringValue // ""' meta.json > kb.b64

      - name: تجهيز المشروع (ملفات مسموحة فقط)
        run: |
          python3 -I - <<'PY'
          import zipfile, json, re, os, shutil
          z = zipfile.ZipFile('in/app.zip')
          names = set(z.namelist())
          def take(src, dst):
              if src in names:
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  with z.open(src) as r, open(dst, 'wb') as w: shutil.copyfileobj(r, w)
                  return True
              return False
          os.makedirs('p', exist_ok=True)
          assert take('www/index.html', 'p/www/index.html'), 'no index.html'
          for f in ['icon-only.png', 'icon-foreground.png', 'icon-background.png', 'splash.png', 'splash-dark.png']:
              take('assets/' + f, 'p/assets/' + f)
          cap = json.loads(z.read('capacitor.config.json')) if 'capacitor.config.json' in names else {}
          app_id = cap.get('appId', '')
          if not re.fullmatch(r'[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+', app_id) or len(app_id) > 100: app_id = 'app.banee.build'
          name = str(cap.get('appName') or 'تطبيقي')[:40]
          plugins = cap.get('plugins') if isinstance(cap.get('plugins'), dict) else {}
          safe = {'appId': app_id, 'appName': name, 'webDir': 'www', 'server': {'androidScheme': 'https'},
                  'plugins': {k: plugins[k] for k in ('SplashScreen', 'StatusBar') if isinstance(plugins.get(k), dict)}}
          json.dump(safe, open('p/capacitor.config.json', 'w'), ensure_ascii=False)
          bg = str((safe['plugins'].get('SplashScreen') or {}).get('backgroundColor') or '#FFFFFF')
          if not re.fullmatch(r'#[0-9a-fA-F]{6}', bg): bg = '#FFFFFF'
          open(os.environ['GITHUB_ENV'], 'a').write('BG=' + bg + '\n')
          pkg = {'name': 'app', 'version': '1.0.0', 'private': True,
                 'dependencies': {'@capacitor/android': '^7.0.0', '@capacitor/app': '^7.0.0', '@capacitor/core': '^7.0.0',
                   '@capacitor/splash-screen': '^7.0.0', '@capacitor/status-bar': '^7.0.0',
                   '@capacitor/share': '^7.0.0', '@capacitor/haptics': '^7.0.0', '@capacitor/local-notifications': '^7.0.0'},
                 'devDependencies': {'@capacitor/cli': '^7.0.0', '@capacitor/assets': '^3.0.5'}}
          # مكتبة الإعلانات فقط إذا فعّلها صاحب التطبيق (موجودة في package.json الذي صدّره بانِي)
          try:
              upkg = json.loads(z.read('package.json')) if 'package.json' in names else {}
              if '@capacitor-community/admob' in (upkg.get('dependencies') or {}): pkg['dependencies']['@capacitor-community/admob'] = '^7.0.0'
          except Exception: pass
          json.dump(pkg, open('p/package.json', 'w'))
          PY

      - name: بناء APK
        working-directory: p
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/; s/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          # معرّف AdMob فقط إذا فعّل صاحب التطبيق الإعلانات (المكتبة موجودة في package.json)
          if grep -q '@capacitor-community/admob' package.json; then sed -i "s|</application>|<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB}\"/></application>|" android/app/src/main/AndroidManifest.xml; fi
          if [ -f assets/icon-only.png ]; then npx @capacitor/assets generate --android --iconBackgroundColor "$BG" --splashBackgroundColor "$BG" --splashBackgroundColorDark "$BG" || true; fi
          npx cap sync android
          cd android && chmod +x gradlew
          if [ "$STORE" != "1" ]; then
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app.apk"
            exit 0
          fi
          # ── حزمة Google Play: مفتاح رفع ثابت لكل تطبيق (يُولَّد أول مرة، ويُعاد في كل تحديث) ──
          mkdir -p "$RUNNER_TEMP/kb" && cd "$RUNNER_TEMP/kb"
          if [ -s "$GITHUB_WORKSPACE/in/kb.b64" ]; then
            base64 -d "$GITHUB_WORKSPACE/in/kb.b64" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -pass env:K > kb.zip
            unzip -o -q kb.zip
          else
            PASS=$(openssl rand -hex 16); echo "$PASS" > pass.txt
            keytool -genkeypair -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Banee App, O=Banee" -noprompt
            zip -q kb.zip upload.jks pass.txt
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -salt -pass env:K -in kb.zip -out "$GITHUB_WORKSPACE/keybox.enc"
          fi
          PASS=$(cat pass.txt); echo "::add-mask::$PASS"
          cd "$GITHUB_WORKSPACE/p/android"
          sed -i "s/versionCode [0-9]*/versionCode $VC/; s/versionName \"[^\"]*\"/versionName \"$VN\"/" app/build.gradle
          cat >> app/build.gradle <<GR
          android {
            signingConfigs { release { storeFile file("$RUNNER_TEMP/kb/upload.jks"); storePassword "$PASS"; keyAlias "upload"; keyPassword "$PASS" } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GR
          ./gradlew bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/app.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app.apk"
          rm -rf "$RUNNER_TEMP/kb"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app.apk
            app.aab
            keybox.enc
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: نشر الرابط
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.client_payload.id }}
        run: |
          echo "$ID" | grep -Eq '^[a-zA-Z0-9]{20}$' || exit 1
          F="app.apk"; [ -f app.aab ] && F="$F app.aab"; [ -f keybox.enc ] && F="$F keybox.enc"
          gh release create "apk-$ID" $F --repo "$GITHUB_REPOSITORY" --title "apk $ID" --notes "بناء سحابي من بانِي" --prerelease
