name: إنشاء مفتاح التوقيع (مرة واحدة)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: إنشاء المفتاح وتشفيره داخل المستودع
        env:
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KP" ]; then echo "::error::أضف السر KEYSTORE_PASSWORD أولاً"; exit 1; fi
          if [ ${#KP} -lt 8 ]; then echo "::error::كلمة المرور يجب أن تكون ٨ أحرف على الأقل"; exit 1; fi
          if [ -f signing/release.jks.enc ]; then echo "::error::المفتاح موجود مسبقاً. لن أستبدله لأن تغييره يمنع تحديث التطبيق على Google Play"; exit 1; fi
          mkdir -p signing
          keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias banee \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KP" -keypass "$KP" -dname "CN=Banee, O=Alloush, C=SD"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in release.jks -out signing/release.jks.enc -pass env:KP
          rm -f release.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/release.jks.enc
          git commit -m "مفتاح التوقيع (مشفّر)"
          git push
