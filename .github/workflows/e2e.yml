name: اختبار حقيقي لبانِي
on:
  workflow_dispatch:
    inputs:
      kit:
        description: 'النظام الجاهز: delivery | store | booking | edu (أو اتركه فارغاً)'
        default: ''
      idea:
        description: 'وصف التطبيق (اختياري، يستبدل وصف النظام الجاهز)'
        default: ''
      sabotage:
        description: 'زرع خطأ بين الشاشات بعد البناء لاختبار وكيل الإصلاح (1 للتفعيل)'
        default: ''
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: تجهيز المتصفح
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: نسخة اختبار من بانِي (بلا خادم، بمفتاح Gemini)
        run: sed "s#^var PROXY_URL = '[^']*';#var PROXY_URL = '';#" www/index.html > e2e.html
      - name: بناء نظام كامل واختباره
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          KIT: ${{ github.event.inputs.kit }}
          IDEA: ${{ github.event.inputs.idea }}
          SABOTAGE: ${{ github.event.inputs.sabotage }}
        run: node e2e/e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banee-e2e
          path: e2e-out
      - name: حفظ النتائج في فرع e2e-results
        if: always()
        run: |
          cd e2e-out 2>/dev/null || exit 0
          rm -f app.html.bak
          git init -q && git checkout -q -b e2e-results
          git config user.name banee-e2e && git config user.email e2e@banee.app
          git add -A && git commit -qm "e2e ${{ github.run_id }}"
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} e2e-results
