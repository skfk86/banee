name: Qadat Al-Nil APK

on:
  push:
    paths: ["qadat-alnil/**", ".github/workflows/qadat-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VER: "4.7-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Download Godot + export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VER
          curl -fsSL -o g.zip $base/Godot_v${GODOT_VER}_linux.x86_64.zip
          curl -fsSL -o t.tpz $base/Godot_v${GODOT_VER}_export_templates.tpz
          unzip -q g.zip && mv Godot_v${GODOT_VER}_linux.x86_64 godot && chmod +x godot
          tdir=~/.local/share/godot/export_templates/${GODOT_VER/-/.}
          mkdir -p $tdir && unzip -q t.tpz -d tmpl && mv tmpl/templates/* $tdir/
      - name: Debug keystore
        run: keytool -genkeypair -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p ~/.config/godot
          echo "[gd_resource type=\"EditorSettings\" format=3]
          [resource]
          export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"
          export/android/java_sdk_path = \"$JAVA_HOME\"" | sed 's/^ *//' > ~/.config/godot/editor_settings-4.tres
          cd qadat-alnil && mkdir -p build
          ../godot --headless --import --quit-after 300 2>&1 | tee import.log || true
          if grep -q "SCRIPT ERROR" import.log; then echo "::error::GDScript errors"; exit 1; fi
          ../godot --headless --export-debug "Android" build/qadat-alnil.apk
          ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: qadat-alnil-apk
          path: qadat-alnil/build/qadat-alnil.apk
