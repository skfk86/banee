name: Qadat assets fetch
on:
  push:
    paths: [".github/workflows/qadat-assets.yml", "tools/qadat/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full ffmpeg libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 >/dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar xJ
          sudo ln -s $PWD/blender-4.2.3-linux-x64/blender /usr/local/bin/blender
          blender --version | head -1
      - name: OGA models
        run: |
          d=qadat-alnil/assets_src/models; mkdir -p $d
          for p in rts-modern-vehicles-tank-truck-harvester heavy-tankextra-low-poly-rts low-poly-tank-assets low-poly-tank-assets-0 missile-launcher-tank low-poly-modern-soldier-rigged low-poly-soldier-with-weapons rigged-lowpoly-ww2-soldier attack-chopper simple-helicopter f-15 mig military-base-3d-model lightapc free-low-poly-vehicles-pack abrams-tank american-tank lowpoly-soviet-jeep hesco-box simple-tank-trap harvester-truck-in-cc-tiberian-sun-style futuristic-artillery-turret old-canon cannons-tank-pack t-12-soviet-light-tank-lowpoly recon-tank uaz-truck turret-gun containers-pack; do
            html=$(curl -sL https://opengameart.org/content/$p)
            lic=$(echo "$html" | grep -oE "license-name'>[^<]+" | sed "s/.*>//" | sort -u | tr '\n' ',')
            auth=$(echo "$html" | grep -oE 'Author:.{0,400}' | grep -oE 'href="/users/[^"]+">[^<]+' | head -1 | sed 's/.*>//')
            echo "$p | $lic | $auth" >> $d/_pages.txt
            mkdir -p work/$p; cd work/$p
            for f in $(echo "$html" | grep -oE 'https://opengameart.org/sites/default/files/[^"'"'"' ]+\.(zip|7z|rar|blend|fbx|obj|dae|glb|gltf|3ds)' | sort -u | head -6); do
              curl -sL -O "$f"
            done
            for z in *.zip *.7z *.rar; do [ -f "$z" ] && 7z x -y -o"x_${z%.*}" "$z" >/dev/null; done
            cd ../..
            n=0
            find work/$p -type f \( -iname '*.blend' -o -iname '*.fbx' -o -iname '*.obj' -o -iname '*.dae' -o -iname '*.glb' -o -iname '*.gltf' -o -iname '*.3ds' \) | head -12 | while read -r m; do
              n=$((n+1)); b=$(basename "$m"); b=${b%.*}; b=$(echo "$b" | tr -c 'A-Za-z0-9_-' '_')
              mkdir -p $d/$p
              timeout 240 blender -b --python-exit-code 1 -P tools/qadat/convert.py -- "$m" "$d/$p/$b.glb" "$d/$p/$b.png" > /tmp/bl.log 2>&1 || { echo "fail $m" >> $d/_fail.txt; tail -5 /tmp/bl.log >> $d/_fail.txt; }
            done
          done
          du -sh $d; ls -R $d | head -200
      - name: Sounds and music
        run: |
          o=qadat-alnil/sounds; mkdir -p $o snd; cd snd
          for z in impact-sounds/87b4ddecda-1677589768/kenney_impact-sounds sci-fi-sounds/6b296f9ecf-1677589334/kenney_sci-fi-sounds interface-sounds/fa43c1dd4d-1677589452/kenney_interface-sounds; do
            curl -sL -o k.zip https://kenney.nl/media/pages/assets/$z.zip && unzip -qo -j k.zip '*.ogg' -d k
          done
          B=https://opengameart.org/sites/default/files
          curl -sL -o desert.wav "$B/Negev%20Desert%20Loop.wav"; curl -sL -o fight.wav "$B/Negev%20Fight%20Loop.wav"
          curl -sL -o lmg.mp3 "$B/lmg_fire01.mp3"; curl -sL -o far.wav "$B/NenadSimic%20-%20Muffled%20Distant%20Explosion.wav"
          cv() { ffmpeg -loglevel error -y -i "$1" -ac 1 -ar 44100 $3 -c:a libvorbis -q:a 6 "../$o/$2.ogg"; }
          cv k/click_002.ogg click
          i=1; for f in select_001 select_002 select_003; do cv k/$f.ogg select_$i; i=$((i+1)); done
          i=1; for f in confirmation_001 confirmation_002 switch_002; do cv k/$f.ogg ack_$i; i=$((i+1)); done
          cv k/error_006.ogg error; cv k/maximize_006.ogg done; cv k/confirmation_004.ogg ready
          i=1; for f in lowFrequency_explosion_000 lowFrequency_explosion_001 explosionCrunch_000 explosionCrunch_001; do cv k/$f.ogg boom_$i; i=$((i+1)); done
          i=1; for f in explosionCrunch_002 explosionCrunch_003 impactPlate_heavy_000; do cv k/$f.ogg shell_$i; i=$((i+1)); done
          cv far.wav art_1 "-af afade=t=out:st=2.2:d=0.6 -t 2.8"
          cv k/lowFrequency_explosion_001.ogg art_2 "-af asetrate=36000,aresample=44100"
          cv k/thrusterFire_000.ogg rocket_1 "-t 0.9 -af afade=t=out:st=0.6:d=0.3"; cv k/thrusterFire_002.ogg rocket_2 "-t 0.9 -af afade=t=out:st=0.6:d=0.3"
          cv k/spaceEngineLarge_000.ogg strike "-af afade=t=in:d=0.5,afade=t=out:st=2:d=0.8 -t 2.8"
          cv lmg.mp3 bullet_1 "-t 0.2 -af afade=t=out:st=0.12:d=0.08"
          cv lmg.mp3 bullet_2 "-ss 0.1 -t 0.2 -af afade=t=out:st=0.12:d=0.08"
          ffmpeg -loglevel error -y -i desert.wav -ac 2 -ar 44100 -c:a libvorbis -q:a 4 ../$o/music.ogg
          ffmpeg -loglevel error -y -i fight.wav -ac 2 -ar 44100 -c:a libvorbis -q:a 4 ../$o/music_battle.ogg
          cd ..; ls -la $o; du -sh $o
          for p in desert-calmness-and-fighting-orchestral-141 light-machine-gun rumbleexplosion muffled-distant-explosion; do
            h=$(curl -sL https://opengameart.org/content/$p)
            echo "$p | $(echo "$h" | grep -oE "license-name'>[^<]+" | sed 's/.*>//' | sort -u | tr '\n' ',') | $(echo "$h" | grep -oE 'Author:.{0,400}' | grep -oE 'href="/users/[^"]+">[^<]+' | head -1 | sed 's/.*>//')" >> qadat-alnil/assets_src/sound_credits.txt
          done
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          find qadat-alnil/assets_src/models -name '*.glb' -size +8M -delete
          git add qadat-alnil/assets_src qadat-alnil/sounds && git commit -m "asset fetch: models + previews" && git pull --rebase -q && git push
