name: Qadat assets fetch
on:
  push:
    paths: [".github/workflows/qadat-assets.yml", "tools/qadat/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full ffmpeg libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 >/dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar xJ
          sudo ln -s $PWD/blender-4.2.3-linux-x64/blender /usr/local/bin/blender
          blender --version | head -1
      - name: Final models (embedded textures)
        run: |
          o=qadat-alnil/models; mkdir -p $o
          get() { curl -sL -o z.zip "$1"; rm -rf zx; mkdir zx; unzip -qo z.zip -d zx; }
          conv() { f=$(find zx -path '*GLB*' -name "$1.glb" | head -1); [ -z "$f" ] && f=$(find zx -name "$1.glb" | head -1); timeout 120 blender -b --python-exit-code 1 -P tools/qadat/convert.py -- "$f" $o/$1.glb /tmp/p.png >/dev/null 2>&1 || echo "fail $1"; rm -f $o/$1.glb.txt; }
          get https://kenney.nl/media/pages/assets/city-kit-industrial/0ec35b139d-1788171848/kenney_city-kit-industrial_2.0.zip
          for n in building-d building-k building-m detail-tank-large water-tower; do conv $n; done
          get https://kenney.nl/media/pages/assets/tower-defense-kit/a402493eaa-1726471567/kenney_tower-defense-kit.zip
          conv weapon-turret
          get https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip
          for n in tree_palmTall tree_palmBend tree_palmDetailedTall cactus_tall cactus_short; do conv $n; done
          get https://kenney.nl/media/pages/assets/survival-kit/4065a8185b-1712149243/kenney_survival-kit.zip
          for n in barrel rock-sand-a rock-sand-b rock-sand-c fence-fortified tent_detailedClosed; do conv $n; done
          S=qadat-alnil/assets_src/models
          cp $S/heavy-tankextra-low-poly-rts/heavy_tank00_.glb $o/tank.glb
          cp $S/free-low-poly-vehicles-pack/Truck_.glb $o/truck.glb
          cp $S/mig/Mig-15_.glb $o/mig.glb
          cp $S/low-poly-tank-assets/sandbags_.glb $o/sandbags.glb
          cp $S/simple-tank-trap/tank_trap_model_.glb $o/tank_trap.glb
          ls -la $o; du -sh $o
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          find qadat-alnil/assets_src/models -name '*.glb' -size +8M -delete
          git add qadat-alnil/models && git commit -m "asset fetch: models + previews" && git pull --rebase -q && git push
