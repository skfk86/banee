name: Qadat assets fetch
on:
  push:
    paths: [".github/workflows/qadat-assets.yml", "tools/qadat/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full ffmpeg libxi6 libxkbcommon0 libxrender1 libgl1 libsm6 >/dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar xJ
          sudo ln -s $PWD/blender-4.2.3-linux-x64/blender /usr/local/bin/blender
          blender --version | head -1
      - name: Kenney models
        run: |
          d=qadat-alnil/assets_src/kenney; mkdir -p $d
          for u in \
            https://kenney.nl/media/pages/assets/city-kit-industrial/0ec35b139d-1788171848/kenney_city-kit-industrial_2.0.zip \
            https://kenney.nl/media/pages/assets/survival-kit/4065a8185b-1712149243/kenney_survival-kit.zip \
            https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip \
            https://kenney.nl/media/pages/assets/tower-defense-kit/a402493eaa-1726471567/kenney_tower-defense-kit.zip \
            https://kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/kenney_car-kit.zip; do
            curl -sL -o z.zip "$u"; rm -rf zx; mkdir zx; unzip -qo z.zip -d zx
            find zx -iname '*.glb' | grep -iE '/(building-[a-t]|water-tower|chimney-large|detail-tank(-large)?|tent(_detailedClosed|-canvas)?|tree_palm(Tall|DetailedTall|Bend)?|cactus_(tall|short)|rock-sand-[abc]|rock_large[AB]|barrel|box-large|fence-fortified|weapon-turret|weapon-cannon|tower-square-(bottom|middle|top)-a|truck|tractor-shovel|structure-metal-wall)\.glb$' | while read -r f; do
              b=$(basename "$f" .glb); cp "$f" $d/$b.glb
              tex=$(dirname "$f")/Textures; [ -d "$tex" ] && cp -r "$tex" $d/ 2>/dev/null
              timeout 120 blender -b --python-exit-code 1 -P tools/qadat/convert.py -- "$f" /tmp/x.glb $d/$b.png >/dev/null 2>&1 || echo "fail $b" >> $d/_fail.txt
            done
          done
          ls $d | head -100; du -sh $d
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          find qadat-alnil/assets_src/models -name '*.glb' -size +8M -delete
          git add qadat-alnil/assets_src && git commit -m "asset fetch: models + previews" && git pull --rebase -q && git push
