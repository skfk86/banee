<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="{{PRIMARY}}">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?{{FONT_QUERY}}&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script>window.lucide = window.lucide || { createIcons: function(){}, icons: {} };</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --primary: {{PRIMARY}};
      --primary-dark: {{PRIMARY_DARK}};
      --primary-soft: {{PRIMARY_SOFT}};
      --accent: {{ACCENT}}; --on-primary: {{ON_PRIMARY}}; --primary-ink: {{PRIMARY_INK}};
      --font: {{FONT}}; --hfont: {{HFONT}};
      --bg: {{BG}}; --surface: #FFFFFF; --surface2: {{SURFACE2}};
      --border: #E3E7EF; --border-strong: #CDD3E0;
      --text: #0E1525; --text2: #4B5468; --text3: #687086;
      --success: #0B7A52; --success-soft: #E2F6EE;
      --warning: #A85A06; --warning-soft: #FDF3E3;
      --error: #C42D33; --error-soft: #FDECEC;
      --r-sm: {{R_SM}}; --r-md: {{R_MD}}; --r-lg: {{R_LG}};
      --shadow: 0 1px 2px rgba(14,21,37,.05), 0 4px 14px rgba(14,21,37,.05);
      --header-h: 56px; --nav-h: 64px;
      --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080C16; --surface: #0F1522; --surface2: #161D2D; --border: #1F2738; --border-strong: #2B3549;
        --text: #ECEFF6; --text2: #A3ABBD; --text3: #8E97AB;
        --success: #34D399; --warning: #FBBF24; --error: #F87171;
        --success-soft: #0C2A1F; --warning-soft: #2A1E0B; --error-soft: #2A1214;
        --primary-soft: color-mix(in srgb, var(--primary) 18%, #0F1522); --primary-ink: {{PRIMARY_INK_DARK}};
        --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
      }
    }
    html, body { height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; }
    button, input, textarea, select { font: inherit; color: inherit; }
    [data-lucide], .lucide { width: 20px; height: 20px; stroke-width: 1.8; flex-shrink: 0; }
    img { max-width: 100%; display: block; }

    /* shell */
    .app-header { position: fixed; top: 0; right: 0; left: 0; z-index: 50; height: calc(var(--header-h) + var(--safe-top)); padding: var(--safe-top) 8px 0 12px;
      display: flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .app-header h1, .title, .section-title, .hero h2, .auth h2, .stat b, .rich .rich-h, .sheet h3, .empty h3 { font-family: var(--hfont); }
    .app-header h1 { flex: 1; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
    .hbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: none; background: none; cursor: pointer; color: var(--text2); }
    .hbtn:active { background: var(--surface2); }
    .pv-banner { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 60; font: 600 10.5px var(--font); color: #7A4A00; background: #FFF4E0; border: 1px solid #F3D9A6; border-top: 0; padding: 2px 10px; border-radius: 0 0 8px 8px; pointer-events: none; }
    .role-pill { height: 30px; padding: 0 10px; border-radius: 100px; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); font: 600 12px var(--font); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
    .role-pill [data-lucide], .role-pill .lucide { width: 14px; height: 14px; }
    .role-opt { width: 100%; text-align: right; display: flex; gap: 12px; align-items: center; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--r-md); background: var(--surface); cursor: pointer; font: inherit; color: var(--text); margin-bottom: 8px; }
    .role-opt.on { border-color: var(--primary); background: var(--primary-soft); }
    .role-opt b { display: block; font-size: 15px; } .role-opt small { color: var(--text2); font-size: 12.5px; line-height: 1.6; }
    .role-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; background: var(--warning-soft); color: var(--warning); }
    .hbtn[hidden], .role-pill[hidden] { display: none; } /* بلا هذا يظهر زر الدور فارغاً في التطبيقات أحادية الدور */
    #app { position: fixed; inset: calc(var(--header-h) + var(--safe-top)) 0 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body.has-nav #app { bottom: calc(var(--nav-h) + var(--safe-bottom)); }
    .screen { padding: 16px; max-width: 720px; margin: 0 auto; animation: in .22s ease; }
    .screen:has(.fab) { padding-bottom: 96px; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .bottom-nav { position: fixed; bottom: 0; right: 0; left: 0; z-index: 50; display: none; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
      background: var(--surface); border-top: 1px solid var(--border); }
    body.has-nav .bottom-nav { display: flex; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: none; background: none; cursor: pointer;
      color: var(--text3); font-size: 11.5px; font-weight: 600; position: relative; }
    .nav-item [data-lucide], .nav-item .lucide { width: 22px; height: 22px; }
    .nav-item.active { color: var(--primary-ink); }
    .nav-item.active::before { content: ''; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }

    /* typography */
    .title { font-size: 22px; font-weight: 700; line-height: 1.3; }
    .subtitle { font-size: 14px; color: var(--text2); }
    .section { margin-top: 22px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .section-title { font-size: 16px; font-weight: 700; }
    .link { color: var(--primary-ink); font-size: 14px; font-weight: 600; background: none; border: none; cursor: pointer; }
    .muted { color: var(--text3); font-size: 13px; }
    .price { font-weight: 700; color: var(--primary-ink); font-variant-numeric: tabular-nums; }

    /* layout */
    .row { display: flex; align-items: center; gap: 10px; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .scroll-x { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }
    .spacer { flex: 1; }

    /* hero */
    .hero { border-radius: var(--r-lg); padding: 20px; color: {{HERO_FG}}; background: {{HERO_BG}}; position: relative; overflow: hidden; }
    .hero::after { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.08); top: -60px; left: -50px; }
    .hero h2 { font-size: 20px; font-weight: 700; position: relative; }
    .hero p { font-size: 14px; opacity: .88; position: relative; margin-top: 4px; }

    /* cards & lists */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
    .card.tap, .item.tap { cursor: pointer; transition: transform .1s; }
    .card.tap:active, .item.tap:active { transform: scale(.985); }
    .media { aspect-ratio: 4/3; border-radius: var(--r-md); background: var(--surface2); object-fit: cover; width: 100%; }
    .media-sq { aspect-ratio: 1; }
    .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
    .item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface); width: 100%; text-align: right; border-inline: 0; border-top: 0; }
    .list .item:last-child { border-bottom: none; }
    .item-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); flex-shrink: 0; }
    .item-thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
    .item-body { flex: 1; min-width: 0; }
        .item-title { font-size: 15px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    /* حماية التصميم: نص الـ hero يتبع لونه، لا شيء يخرج من البطاقة، والأوصاف داخل البطاقات مختصرة */
    .hero p, .hero .muted, .hero .subtitle, .hero .item-sub, .hero small { color: inherit !important; opacity: .9; }
    .card, .item { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .card *, .item * { min-width: 0; max-width: 100%; }
    .card .lucide, .card img, .card .avatar, .card .item-thumb, .card .badge, .item .lucide, .item img, .item .avatar, .item-thumb { flex-shrink: 0; }
    .card .row, .item .row { flex-wrap: wrap; }
    .card p:not(.rich p):not([data-full]), .card .item-sub { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .item-sub { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); font-weight: 700; flex-shrink: 0; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; }
    .stat b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 13px; color: var(--text2); }

    /* buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: var(--r-sm); border: 1px solid transparent;
      font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background .15s, transform .1s; white-space: nowrap; }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .55; }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-outline { background: transparent; border-color: var(--primary-ink); color: var(--primary-ink); }
    .btn-ghost { background: var(--surface2); color: var(--text); } .hero .btn-ghost { background: rgba(255,255,255,.16) !important; color: var(--on-primary) !important; border-color: rgba(255,255,255,.3); }
    .btn-danger { background: #C42D33; color: #fff; }
    .btn-sm { height: 36px; font-size: 13.5px; padding: 0 12px; width: auto; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text2); flex-shrink: 0; }
    .fab { position: fixed; left: 18px; bottom: calc(var(--nav-h) + var(--safe-bottom) + 18px); width: 56px; height: 56px; border-radius: 18px; border: none; background: var(--primary); color: var(--on-primary);
      display: grid; place-items: center; box-shadow: 0 8px 24px color-mix(in srgb, var(--primary) 45%, transparent); cursor: pointer; z-index: 40; }
    body:not(.has-nav) .fab { bottom: calc(var(--safe-bottom) + 18px); }

    /* chips & badges */
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 100px; border: 1px solid var(--border); background: var(--surface);
      font-size: 13.5px; font-weight: 500; color: var(--text2); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .chip.active { background: var(--primary); border-color: var(--primary-ink); color: var(--on-primary); }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; background: var(--surface2); color: var(--text2); }
    .badge-primary { background: var(--primary-soft); color: var(--primary-ink); }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-error { background: var(--error-soft); color: var(--error); }

    /* forms */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .label { font-size: 13px; font-weight: 600; color: var(--text2); }
    .input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface); font-size: 15px; transition: border-color .15s, box-shadow .15s; }
    textarea.input { height: auto; min-height: 100px; padding: 12px 14px; resize: vertical; }
    .input:focus { outline: none; border-color: var(--primary-ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
    .search { position: relative; }
    .search .input { padding-right: 42px; }
    .search [data-lucide], .search .lucide { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--text3); width: 18px; height: 18px; }
    .seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 4px; gap: 4px; }
    .seg button { flex: 1; height: 36px; border: none; border-radius: 9px; background: none; font-size: 14px; font-weight: 600; color: var(--text2); cursor: pointer; }
    .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .qty { display: inline-flex; align-items: center; gap: 10px; }
    .qty button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
    .progress { height: 8px; background: var(--surface2); border-radius: 8px; overflow: hidden; }
    .progress > div { height: 100%; background: var(--primary); border-radius: 8px; transition: width .4s; }

    /* states */
    .sk { background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%); background-size: 200% 100%; animation: sh 1.3s infinite; border-radius: 8px; }
    @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .sk-card { display: flex; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 10px; }
    .sk-img { width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; }
    .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
    .sk-line { height: 12px; } .sk-line.short { width: 55%; }
    .empty { text-align: center; padding: 48px 20px; }
    .empty-icon { width: 64px; height: 64px; border-radius: 20px; background: var(--surface2); color: var(--text3); display: grid; place-items: center; margin: 0 auto 14px; }
    .empty-icon [data-lucide], .empty-icon .lucide { width: 28px; height: 28px; }
    .empty h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .empty p { font-size: 14px; color: var(--text2); margin-bottom: 16px; }

    /* long content */
    .rich { font-size: 16px; line-height: 1.9; color: var(--text); }
    .rich p { margin: 0 0 12px; }
    .rich .rich-h { font-size: 17px; font-weight: 700; margin: 22px 0 8px; line-height: 1.4; }
    .rich h3.rich-h { font-size: 19px; }
    .rich ul, .rich ol { margin: 0 0 14px; padding-right: 22px; display: flex; flex-direction: column; gap: 6px; }
    .rich code { font-family: ui-monospace, monospace; font-size: .9em; background: var(--surface2); padding: 1px 6px; border-radius: 6px; direction: ltr; unicode-bidi: isolate; }
    .rich blockquote { margin: 0 0 14px; padding: 12px 14px; border-radius: var(--r-md); background: var(--primary-soft); border-right: 3px solid var(--primary); }
    .rich [dir="ltr"], .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
    .choice { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px; border-radius: var(--r-md); border: 1.5px solid var(--border); background: var(--surface); font-size: 15px; text-align: right; cursor: pointer; margin-bottom: 10px; }
    .choice.correct { border-color: var(--success); background: var(--success-soft); }
    .choice.wrong { border-color: var(--error); background: var(--error-soft); }
    .choice.picked { border-color: var(--primary-ink); background: var(--primary-soft); }

    /* maps & media */
    .map { width: 100%; height: 260px; border-radius: var(--r-lg); overflow: hidden; background: var(--surface2); border: 1px solid var(--border); position: relative; z-index: 0; }
    .map-ph { height: 100%; display: grid; place-items: center; color: var(--text3); }
    .photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: var(--r-md); background: var(--surface2); }
    .bubble { max-width: 80%; padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.6; margin-bottom: 8px; word-wrap: break-word; }
    .bubble.me { margin-inline-start: auto; background: var(--primary); color: var(--on-primary); border-end-end-radius: 4px; }
    .bubble.them { background: var(--surface); border: 1px solid var(--border); border-end-start-radius: 4px; }
    .bubble small { display: block; font-size: 11px; opacity: .7; margin-top: 3px; }
    .composer { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 0; background: var(--bg); }
    .composer .input { flex: 1; }

    /* sheet & toast */
    .sheet-bg { position: fixed; inset: 0; background: rgba(6,10,20,.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 12px 18px calc(20px + var(--safe-bottom)); animation: up .25s cubic-bezier(.2,.8,.2,1); }
    @keyframes up { from { transform: translateY(100%); } }
    .sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 0 auto 16px; }
    .sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); transform: translateX(-50%) translateY(14px); opacity: 0; z-index: 300;
      display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: #0B1220; color: #fff; font-size: 14px; transition: all .25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-success [data-lucide], .toast-success .lucide { color: #3DDBA4; }
    .toast-error [data-lucide], .toast-error .lucide { color: #FF7A7E; }

    /* auth */
    .auth { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 24px 4px; }
    .auth-logo { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(140deg, var(--primary), var(--primary-dark)); color: var(--on-primary); margin: 0 auto 14px; }
    .auth-logo [data-lucide], .auth-logo .lucide { width: 30px; height: 30px; }
    .auth h2 { text-align: center; font-size: 22px; font-weight: 700; }
    .auth > p { text-align: center; color: var(--text2); margin-bottom: 24px; }
    .auth-switch { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text2); }
    /* ══ طبقة التصميم v2: عمق، حركة، وتفاصيل بمستوى تطبيقات المتاجر العالمية (تعلو ما سبق دون كسره) ══ */
    :root {
      --hair: color-mix(in srgb, var(--text) 8%, transparent);
      --shadow-sm: 0 1px 2px rgba(14,21,37,.04), 0 2px 6px rgba(14,21,37,.04);
      --shadow: 0 1px 2px rgba(14,21,37,.04), 0 6px 20px -4px rgba(14,21,37,.08);
      --shadow-lg: 0 2px 6px rgba(14,21,37,.05), 0 18px 40px -12px rgba(14,21,37,.18);
      --glow: 0 8px 22px -8px color-mix(in srgb, var(--primary) 70%, transparent);
      --ease: cubic-bezier(.2,.8,.2,1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --hair: rgba(255,255,255,.07); --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -6px rgba(0,0,0,.5); --shadow-lg: 0 18px 40px -12px rgba(0,0,0,.7); }
    }
    body { background: radial-gradient(120% 60% at 100% 0%, color-mix(in srgb, var(--primary) 9%, var(--bg)) 0%, var(--bg) 55%) fixed, var(--bg); font-feature-settings: "tnum" 0; }
    .app-header { border-bottom: 1px solid var(--hair); background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: saturate(1.6) blur(18px); }
    .app-header h1 { font-size: 18px; font-weight: 800; letter-spacing: -.2px; }
    .role-pill { background: var(--surface); border-color: var(--hair); box-shadow: var(--shadow-sm); }

    /* hero: تدرج متعدد الطبقات مع نقش خفيف، أقصر وأكثر أناقة */
    .hero { padding: 22px 20px; border-radius: calc(var(--r-lg) + 4px); box-shadow: var(--shadow-lg); isolation: isolate; background-color: var(--primary-dark);
      background: radial-gradient(90% 120% at 0% 0%, rgba(255,255,255,.18), transparent 55%), radial-gradient(70% 90% at 100% 100%, rgba(0,0,0,.18), transparent 60%), {{HERO_BG}}; }
    .hero::after { width: 220px; height: 220px; top: -90px; left: -70px; background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); z-index: -1; }

<body>

  <script type="module">
    // ═════════════ إعدادات ═════════════
    const META = {{META}};

    // معرّف الإعلان من إعدادات صاحب التطبيق، وإلا معرّف Google التجريبي (والإعلانات معطّلة أصلاً ما لم يفعّلها)

    // ═════════════ أدوات الواجهة ═════════════
    const UI = {
      esc(s) { return UI._e(String(s ?? '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*\*/g, '').replace(/^\s*(?:>|#{1,6})\s+/gm, '')); },
_e(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
      icons() { document.querySelectorAll('[data-lucide]').forEach(n => { const v = n.getAttribute('data-lucide'); if (/[A-Z_ ]/.test(v)) n.setAttribute('data-lucide', v.replace(/([a-z0-9])([A-Z])/g, '$1-$2').replace(/[_ ]+/g, '-').toLowerCase()); }); try { window.lucide.createIcons(); } catch (e) {}
        // أيقونة باسم غير موجود في Lucide تبقى مربعاً فارغاً: نجرّب اسماً قريباً ثم أيقونة بديلة حسب المعنى

        const close = () => { if (list) { html += `</${list}>`; list = null; } };
        for (const raw of lines) {
          const l = raw.trim();
          if (!l) { close(); continue; }

      async list(c, o = {}) {
        let d = this._all(c);
        if (o.where) { const ws = Array.isArray(o.where[0]) ? o.where : [o.where]; ws.forEach(([f, op, v]) => { d = d.filter(x => cmp(x[f], op, v)); }); }
        const [f, dir] = o.orderBy || ['createdAt', 'desc'];
        d = [...d].sort((a, b) => (a[f] > b[f] ? 1 : a[f] < b[f] ? -1 : 0) * (dir === 'desc' ? -1 : 1));
        return o.limit ? d.slice(0, o.limit) : d;
      },
      async get(c, id) { return this._all(c).find(x => String(x.id) === String(id)) || null; },
      async add(c, data) { const d = this._all(c); const x = { ...data, id: genId(), createdAt: Date.now() }; d.unshift(x); Store.set('db_' + c, d); return x.id; },
      async set(c, id, data) { const d = this._all(c); const i = d.findIndex(x => String(x.id) === String(id)); const x = { createdAt: Date.now(), ...(i > -1 ? d[i] : {}), ...data, id }; if (i > -1) d[i] = x; else d.unshift(x); Store.set('db_' + c, d); },
      async update(c, id, patch) { const d = this._all(c); const i = d.findIndex(x => String(x.id) === String(id)); if (i > -1) { d[i] = { ...d[i], ...patch, updatedAt: Date.now() }; Store.set('db_' + c, d); } },
      async remove(c, id) { Store.set('db_' + c, this._all(c).filter(x => String(x.id) !== String(id))); }
    };

    let FS = null;
    const CloudDB = {
      async list(c, o = {}) {
        const { collection, query, where, orderBy, limit, getDocs } = FS.m;
        const parts = [];
        if (o.where) { const ws = Array.isArray(o.where[0]) ? o.where : [o.where]; ws.forEach(([f, op, v]) => parts.push(where(f, op, v))); }
        if (o.orderBy) parts.push(orderBy(o.orderBy[0], o.orderBy[1] || 'asc'));
        if (o.limit) parts.push(limit(o.limit));
        const snap = await getDocs(query(collection(FS.db, ...ROOT, c), ...parts));
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
      },
      async get(c, id) { const s = await FS.m.getDoc(FS.m.doc(FS.db, ...ROOT, c, String(id))); return s.exists() ? { id: s.id, ...s.data() } : null; },
      async add(c, data) { const r = await FS.m.addDoc(FS.m.collection(FS.db, ...ROOT, c), { ...data, createdAt: Date.now() }); return r.id; },
      async set(c, id, data) { await FS.m.setDoc(FS.m.doc(FS.db, ...ROOT, c, String(id)), { createdAt: Date.now(), ...data }, { merge: true }); },
      async update(c, id, patch) { await FS.m.updateDoc(FS.m.doc(FS.db, ...ROOT, c, String(id)), { ...patch, updatedAt: Date.now() }); },
      async remove(c, id) { await FS.m.deleteDoc(FS.m.doc(FS.db, ...ROOT, c, String(id))); }
    };
    const DB = {
      list: (c, o) => (LIVE ? CloudDB : LocalDB).list(c, o),
      get: (c, id) => (LIVE ? CloudDB : LocalDB).get(c, id),
      add: (c, d) => (LIVE ? CloudDB : LocalDB).add(c, d),
      set: (c, id, d) => (LIVE ? CloudDB : LocalDB).set(c, id, d),
      update: (c, id, p) => (LIVE ? CloudDB : LocalDB).update(c, id, p),
      remove: (c, id) => (LIVE ? CloudDB : LocalDB).remove(c, id)
    };

    // ═════════════ عدّادات عامة (Tally) ═════════════
    // عدد العناصر القائمة ومجموع amount لكل قيمة ربط (classId، bookId، campaignId…) يقرؤها الجميع دون كشف البيانات الخاصة:
    // «٣ مقاعد متبقية» تحتاج عدّ حجوزات الآخرين، وقواعد الخصوصية تمنع قراءتها. محلياً تُحسب مباشرة، وفي السحابة تُحدَّث
    // بـ increment مع كل إنشاء وتغيير وحذف، ويعيد صاحب التطبيق حسابها من البيانات الفعلية عند فتح لوحة الإدارة.
    const Tally = {
      FREE: /^(cancelled|canceled|rejected|returned|expired|refunded|failed)$/,
      keys: o => Object.keys(o || {}).filter(k => /Id$/.test(k) && k !== 'userId' && typeof o[k] === 'string' && o[k]),
      live: o => !!o && !Tally.FREE.test(String(o.status || '')),
      id: (c, k, v) => (c + '__' + k + '__' + v).replace(/[\/\s]/g, '_').slice(0, 400),
      async bump(c, before, after) {
        if (!LIVE || c === '_tally') return;
        const d = {};
        const put = (o, sg) => { if (!Tally.live(o)) return; Tally.keys(o).forEach(k => { const id = Tally.id(c, k, o[k]); d[id] = d[id] || { n: 0, amount: 0 }; d[id].n += sg; d[id].amount += sg * (Number(o.amount) || 0); }); };
        put(before, -1); put(after, 1);
        const { doc, setDoc, increment } = FS.m;
        await Promise.all(Object.keys(d).filter(id => d[id].n || d[id].amount).map(id =>
          setDoc(doc(FS.db, ...ROOT, '_tally', id), { n: increment(d[id].n), amount: increment(d[id].amount) }, { merge: true }).catch(e => console.warn('tally', e && e.message))));
      },
      async get(c, field, value) {
        if (!LIVE) { const a = await LocalDB.list(c, {}); const m = a.filter(o => o[field] === value && Tally.live(o)); return { n: m.length, amount: m.reduce((t, o) => t + (Number(o.amount) || 0), 0) }; }
        try { const x = await CloudDB.get('_tally', Tally.id(c, field, value)); return { n: Math.max(0, (x && x.n) || 0), amount: (x && x.amount) || 0 }; } catch (e) { return { n: 0, amount: 0 }; }
      },
      async rebuild(cols) {
        if (!LIVE) return;
        const out = {};
        for (const c of cols) (await CloudDB.list(c).catch(() => [])).filter(Tally.live).forEach(o => Tally.keys(o).forEach(k => { const id = Tally.id(c, k, o[k]); out[id] = out[id] || { n: 0, amount: 0 }; out[id].n++; out[id].amount += Number(o.amount) || 0; }));
        (await CloudDB.list('_tally').catch(() => [])).forEach(t => { if (!out[t.id] && (t.n || t.amount)) out[t.id] = { n: 0, amount: 0 }; });
        await Promise.all(Object.keys(out).map(id => FS.m.setDoc(FS.m.doc(FS.db, ...ROOT, '_tally', id), out[id]).catch(() => {})));
      }
    };
    { // كل كتابة في السحابة تحدّث العدّادات (حتى DB المباشر من الشاشات)
      const A = DB.add, U = DB.update, R = DB.remove, S = DB.set;
      DB.add = async (c, d) => { const id = await A(c, d); if (LIVE) Tally.bump(c, null, d); return id; };
      DB.update = async (c, id, p) => { const b = LIVE ? await CloudDB.get(c, id).catch(() => null) : null; await U(c, id, p); if (b) Tally.bump(c, b, { ...b, ...p }); };
      DB.set = async (c, id, d) => { const b = LIVE ? await CloudDB.get(c, id).catch(() => null) : null; await S(c, id, d); if (LIVE) Tally.bump(c, b, { ...(b || {}), ...d }); };
      DB.remove = async (c, id) => { const b = LIVE ? await CloudDB.get(c, id).catch(() => null) : null; await R(c, id); if (b) Tally.bump(c, b, null); };
    }

    // ═════════════ تحديثات حيّة (دردشة، طلبات، إشعارات داخلية) ═════════════
    const Bus = { subs: {}, emit(c) { (this.subs[c] || []).forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); } };
    window.addEventListener('storage', e => { if (e.key && e.key.startsWith(NS + 'db_')) Bus.emit(e.key.slice((NS + 'db_').length)); });
    DB.watch = (c, o, cb) => {
      if (typeof o === 'function') { cb = o; o = {}; }
      if (LIVE) {
        const { collection, query, where, orderBy, limit, onSnapshot } = FS.m;
        const parts = [];
        if (o.where) { const ws = Array.isArray(o.where[0]) ? o.where : [o.where]; ws.forEach(([f, op, v]) => parts.push(where(f, op, v))); }
        if (o.orderBy) parts.push(orderBy(o.orderBy[0], o.orderBy[1] || 'asc'));
        if (o.limit) parts.push(limit(o.limit));
        const off = onSnapshot(query(collection(FS.db, ...ROOT, c), ...parts), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => console.error(e));
        App.onLeave(off); return off;
      }
      const run = () => LocalDB.list(c, o).then(cb).catch(e => console.error(e));
      (Bus.subs[c] = Bus.subs[c] || []).push(run); run();
      const off = () => { Bus.subs[c] = (Bus.subs[c] || []).filter(f => f !== run); };
      App.onLeave(off); return off;
    };
    ['add', 'set', 'update', 'remove'].forEach(m => { const orig = DB[m]; DB[m] = async (c, ...a) => { const r = await orig(c, ...a); if (!LIVE) Bus.emit(c); return r; }; });

    // ═════════════ قدرات سحابية: بيانات حية، ذكاء اصطناعي، إشعارات ═════════════
    const Cloud = {
      async call(body) {
        // داخل معاينة بانِي: يمر الطلب عبر حساب صاحب التطبيق في بانِي
        if (!LIVE) { let p = null; try { p = window.parent !== window && window.parent.baneeAppCall; } catch (e) {} if (p) return p(body); }
        if (!META.api) throw new Error('هذه الميزة غير مفعّلة من صاحب التطبيق بعد');
        let auth;
        // التطبيق المنشور: خادم صاحب التطبيق الخاص (Apps Script بمفتاحه)، ولا يمر بخادم بانِي
        if (META.own) { let dev = Store.get('dev_id'); if (!dev) { dev = genId() + genId(); Store.set('dev_id', dev); } auth = { device: (Auth.user && Auth.user.uid) || dev }; }
        else if (META.cloud && FS && FS.auth.currentUser) auth = { idToken: await FS.auth.currentUser.getIdToken() };
        else throw new Error('هذه الميزة غير مفعّلة من صاحب التطبيق بعد');
        const r = await fetch(META.api, { method: 'POST', body: JSON.stringify(Object.assign({}, body, auth)) });
        return r.json();
      }
    };
    // بيانات حية من أي رابط https (JSON أو نص) عبر الخادم، مع تخزين مؤقت
    const Net = {
      async get(url, { ttl = 600 } = {}) {
        if (META.test) return {};
        const r = await Cloud.call({ op: 'fetch', url, ttl });
        if (!r || !r.ok) throw new Error((r && r.error && r.error.message) || 'تعذّر جلب البيانات');
        try { return JSON.parse(r.body); } catch (e) { return r.body; }
      }
    };
    // ذكاء اصطناعي داخل التطبيق: بمفتاح Gemini الخاص بصاحب التطبيق على خادمه
    const AI = {
      async ask(prompt, { system = '', json = false } = {}) {
        if (META.test) return json ? {} : 'رد تجريبي من المساعد الذكي.';
        const r = await Cloud.call({ op: 'appAsk', appId: META.cloud ? META.cloud.id : META.own ? 'own' : 'preview', prompt: String(prompt), system, json });
        if (!r || !r.ok) throw new Error((r && r.error && r.error.message) || 'تعذّر الرد، حاول مرة أخرى');
        if (json) { try { return JSON.parse(r.text); } catch (e) { return {}; } }
        return r.text;
      }
    };
    // إشعارات صاحب التطبيق: تصل للجوال حتى والتطبيق مغلق (بعد النشر)، وتظهر داخل التطبيق أيضاً
    const Push = {
      async init() {
        const P = (window.Capacitor && window.Capacitor.Plugins || {}).PushNotifications;
        if (!META.push || !LIVE || !P || !(window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return;
        try {
          let perm = await P.checkPermissions(); if (perm.receive !== 'granted') perm = await P.requestPermissions();
          if (perm.receive !== 'granted') return;
          P.addListener('registration', t => { if (Auth.user) DB.set('devices', Auth.user.uid, { token: t.value, userId: Auth.user.uid, platform: 'android', updatedAt: Date.now() }).catch(() => {}); });
          P.addListener('pushNotificationActionPerformed', a => { const r = a && a.notification && a.notification.data && a.notification.data.route; if (r && r.startsWith('/')) App.go(r); });
          P.addListener('pushNotificationReceived', n => UI.toast((n.title || '') + (n.body ? ' — ' + n.body : ''), 'info'));
          await P.register();
        } catch (e) { console.warn('push', e); }
      },
      async notices() {
        if (!LIVE || !META.cloud) return;
        try {
          const [n] = await DB.list('notices', { orderBy: ['createdAt', 'desc'], limit: 1 });
          if (!n || Store.get('notice_seen', 0) >= n.createdAt) return;
          Store.set('notice_seen', n.createdAt);
          if (Date.now() - n.createdAt > 7 * 864e5) return;
          const sh = UI.sheet(`<div class="row" style="gap:10px;align-items:center"><span class="item-icon"><i data-lucide="bell"></i></span><h3 style="flex:1">${UI.esc(n.title)}</h3></div>${n.body ? `<p style="margin:10px 0 16px;color:var(--text2);line-height:1.8">${UI.esc(n.body)}</p>` : ''}<button class="btn btn-primary" data-r="go">${n.route && n.route !== '/' ? 'عرض' : 'حسناً'}</button>`);
          App.on(sh, 'click', '[data-r=go]', () => { UI.closeSheet(); if (n.route && n.route.startsWith('/')) App.go(n.route); });
        } catch (e) { console.warn('notices', e); }
      }
    };

    // ═════════════ قدرات الجهاز ═════════════
    const Cap = () => window.Capacitor && window.Capacitor.Plugins || {};
    const Device = {
      // صورة من الكاميرا أو المعرض ← dataURL مضغوطة، أو null إذا ألغى المستخدم
      photo({ camera = false, maxSize = 1000, quality = 0.75 } = {}) {
        if (META.test) { const c = document.createElement('canvas'); c.width = c.height = 8; return Promise.resolve(c.toDataURL('image/jpeg', .5)); }
        return new Promise(res => {
          const inp = document.createElement('input');
          inp.type = 'file'; inp.accept = 'image/*'; if (camera) inp.setAttribute('capture', 'environment');
          let done = false; const finish = v => { if (!done) { done = true; res(v); } };
          inp.onchange = () => {
            const f = inp.files && inp.files[0]; if (!f) return finish(null);
            const url = URL.createObjectURL(f), img = new Image();
            img.onload = () => {
              const s = Math.min(1, maxSize / Math.max(img.width, img.height)), c = document.createElement('canvas');
              c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
              c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
              finish(c.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => { UI.toast('تعذّر قراءة الصورة', 'error'); finish(null); };
            img.src = url;
          };
          window.addEventListener('focus', () => setTimeout(() => { if (!inp.files || !inp.files.length) finish(null); }, 1200), { once: true });
          inp.click();
        });
      },
      // الموقع الحالي ← {lat, lng, accuracy}، ويرمي خطأ برسالة عربية
      location({ timeout = 12000 } = {}) {
        if (META.test) return Promise.resolve({ lat: 15.5007, lng: 32.5599, accuracy: 20 });
        return new Promise((res, rej) => {
          if (!navigator.geolocation) return rej(new Error('الجهاز لا يدعم تحديد الموقع'));
          navigator.geolocation.getCurrentPosition(
            p => res({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
            e => rej(new Error(e.code === 1 ? 'اسمح للتطبيق بالوصول إلى موقعك من الإعدادات' : 'تعذّر تحديد موقعك، تأكد من تشغيل GPS')),
            { enableHighAccuracy: true, timeout, maximumAge: 60000 });
        });
      },
      distance(a, b) { // بالكيلومتر
        const R = 6371, r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      },
      async share({ title = META.name, text = '', url = '' } = {}) {
        try {
          if (Cap().Share) { await Cap().Share.share({ title, text, url, dialogTitle: 'مشاركة' }); return true; }
          if (navigator.share) { await navigator.share({ title, text, url }); return true; }
          await navigator.clipboard.writeText([text, url].filter(Boolean).join('\n')); UI.toast('نُسخ النص، الصقه حيث تريد', 'success'); return true;
        } catch (e) { return false; }
      },
      speak(text, lang = 'en-US', rate = 0.9) {
        if (!window.speechSynthesis) { UI.toast('النطق غير مدعوم على هذا الجهاز', 'error'); return false; }
        speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = rate; speechSynthesis.speak(u); return true;
      },
      vibrate(ms = 30) { try { if (Cap().Haptics) Cap().Haptics.vibrate({ duration: ms }); else if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} },
      // إشعار محلي فوري أو في وقت محدد (at: ميلي ثانية)
      async notify(title, body, at) {
        if (META.test) return true;
        try {
          const LN = Cap().LocalNotifications;
          if (LN) {
            const p = await LN.requestPermissions(); if (p.display !== 'granted') return false;
            await LN.schedule({ notifications: [{ id: Math.floor(Math.random() * 2e9), title, body, schedule: at ? { at: new Date(at) } : undefined }] });
            return true;
          }
          if (!('Notification' in window)) return false;
          if (Notification.permission !== 'granted' && (await Notification.requestPermission()) !== 'granted') return false;
          const show = () => new Notification(title, { body });
          if (at && at > Date.now()) setTimeout(show, Math.min(at - Date.now(), 2147483647)); else show();
          return true;
        } catch (e) { return false; }
      },
      openMap(lat, lng, label = '') { window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`, '_blank'); },
      call(phone) { location.href = 'tel:' + String(phone).replace(/[^\d+]/g, ''); },
      whatsapp(phone, text = '') { window.open('https://wa.me/' + String(phone).replace(/[^\d]/g, '') + (text ? '?text=' + encodeURIComponent(text) : ''), '_blank'); }
    };

    // ═════════════ الخرائط (OpenStreetMap عبر Leaflet) ═════════════
    const Maps = {
      _p: null,
      _load() {
        if (window.L) return Promise.resolve(window.L);
        if (this._p) return this._p;
        this._p = new Promise((res, rej) => {
          const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
          const js = document.createElement('script'); js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
          js.onload = () => res(window.L); js.onerror = () => { this._p = null; rej(new Error('تعذّر تحميل الخريطة')); };
          document.head.appendChild(js);
        });
        return this._p;
      },
      // markers: [{lat, lng, title, id}] · onMarker(marker) عند الضغط · يُرجع كائن الخريطة أو null
      async show(el, { center, zoom = 13, markers = [], onMarker } = {}) {
        if (!el) return null;
        el.classList.add('map');
        const c = center || (markers[0] ? [markers[0].lat, markers[0].lng] : [15.5007, 32.5599]);
        if (META.test) { el.innerHTML = '<div class="map-ph"><i data-lucide="map"></i></div>'; return null; }
        try {
          const L = await this._load();
          el.innerHTML = '';
          const map = L.map(el, { zoomControl: false, attributionControl: true }).setView(c, zoom);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
          markers.forEach(m => {
            const mk = L.marker([m.lat, m.lng]).addTo(map);
            if (m.title) mk.bindTooltip(UI.esc(m.title), { direction: 'top' });
            if (onMarker) mk.on('click', () => onMarker(m));
          });
          setTimeout(() => map.invalidateSize(), 200);
          App.onLeave(() => map.remove());
          return map;
        } catch (e) {
          el.innerHTML = UI.empty('map-off', 'تعذّر تحميل الخريطة', 'تأكد من الاتصال بالإنترنت');
          UI.icons(); return null;
        }
      }
    };

    // ═════════════ الدفع (بنكك / عند الاستلام) ═════════════
    const Pay = {
      // يفتح نافذة الدفع ويُنشئ طلباً في المجموعة orders ← id الطلب أو null إذا ألغى
      checkout({ amount, title = '', items = [], extra = {} } = {}) {
        const P = META.pay || {};
        const methods = (P.methods && P.methods.length ? P.methods : ['bankak', 'cod']);
        return new Promise(res => {
          let method = methods[0], receipt = null;
          const s = UI.sheet(`
            <h3>إتمام الطلب</h3>
            <div class="card" style="margin-bottom:14px"><div class="row"><span class="muted">${UI.esc(title)}</span><span class="spacer"></span><b class="price">${UI.money(amount, P.currency || 'ج.س')}</b></div></div>
            <div class="stack" id="pm">
              ${methods.includes('bankak') ? `<button class="choice picked" data-m="bankak"><i data-lucide="landmark"></i><span>تحويل عبر بنكك</span></button>` : ''}
              ${methods.includes('cod') ? `<button class="choice ${methods[0] === 'cod' ? 'picked' : ''}" data-m="cod"><i data-lucide="banknote"></i><span>الدفع عند الاستلام</span></button>` : ''}
            </div>
            <div id="pb"></div>
            <button class="btn btn-primary" data-act="pay" style="margin-top:14px">تأكيد الطلب</button>`);
          const body = () => {
            s.querySelector('#pb').innerHTML = method === 'bankak' ? `
              <div class="card" style="margin-top:4px">
                <p class="muted">حوّل المبلغ إلى الحساب التالي ثم أرفق صورة الإشعار:</p>

                <button class="btn btn-ghost btn-sm" data-act="receipt"><i data-lucide="image-plus"></i>${receipt ? 'تم إرفاق الإشعار' : 'إرفاق صورة الإشعار'}</button>
              </div>` : `<p class="muted" style="margin-top:6px">ستدفع ${UI.money(amount, P.currency || 'ج.س')} نقداً عند الاستلام.</p>`;
            UI.icons();
          };
          body();
          s.addEventListener('click', async e => {
            const m = e.target.closest('[data-m]');
            if (m) { method = m.dataset.m; s.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('picked', x === m)); body(); return; }
            if (e.target.closest('[data-act=receipt]')) { const r = await Device.photo({ maxSize: 900 }); if (r) { receipt = r; body(); } return; }
            const b = e.target.closest('[data-act=pay]');
            if (b) {
              if (method === 'bankak' && !receipt) return UI.toast('أرفق صورة إشعار التحويل', 'error');
              UI.busy(b, true);
              try {
                const id = await DB.add('orders', { userId: Auth.user.uid, userName: Auth.user.name, amount, title, items, method, receipt, status: method === 'cod' ? 'confirmed' : 'pending', ...extra });
                UI.closeSheet(); UI.toast(method === 'cod' ? 'تم تأكيد طلبك' : 'استلمنا طلبك، سنراجع التحويل قريباً', 'success'); res(id);
              } catch (err) { UI.busy(b, false); UI.toast('تعذّر إرسال الطلب', 'error'); }
            }
          });
          const bg = document.getElementById('sheet');
          bg.addEventListener('click', e => { if (e.target === bg) res(null); });
        });
      }
    };

    // ═════════════ تسجيل الدخول ═════════════
    const AUTH_ERR = {
      'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة', 'auth/user-not-found': 'البريد الإلكتروني غير مسجل',
      'auth/wrong-password': 'كلمة المرور غير صحيحة', 'auth/email-already-in-use': 'البريد الإلكتروني مستخدم مسبقاً',
      'auth/weak-password': 'كلمة المرور قصيرة (٦ أحرف على الأقل)', 'auth/invalid-email': 'البريد الإلكتروني غير صحيح',
      'auth/network-request-failed': 'لا يوجد اتصال بالإنترنت', 'auth/too-many-requests': 'محاولات كثيرة، انتظر قليلاً'
    };
    const Auth = {
      user: null,
      async signIn(email, password) {
        if (LIVE && META.preview) return Auth._preview(email.split('@')[0], email);
        if (LIVE) { const r = await FS.a.signInWithEmailAndPassword(FS.auth, email, password); return Auth._set(r.user); }
        const users = Store.get('users', []); const u = users.find(x => x.email === email && x.password === password);
        if (!u) throw { code: 'auth/invalid-credential' };
        return Auth._local(u);
      },
      async signUp(name, email, password) {
        if (password.length < 6) throw { code: 'auth/weak-password' };
        if (LIVE && META.preview) { const u = await Auth._preview(name, email); await DB.set('users', u.uid, { name, email, userId: u.uid }); return u; }
        if (LIVE) { const r = await FS.a.createUserWithEmailAndPassword(FS.auth, email, password); await FS.a.updateProfile(r.user, { displayName: name }); await DB.set('users', r.user.uid, { name, email }); return Auth._set(r.user, name); }
        const users = Store.get('users', []); if (users.some(x => x.email === email)) throw { code: 'auth/email-already-in-use' };
        const u = { uid: genId(), name, email, password }; users.push(u); Store.set('users', users);
        await DB.set('users', u.uid, { name, email });
        return Auth._local(u);
      },
      async signOut() { if (LIVE) await FS.a.signOut(FS.auth); Store.set('pv_user', null); Auth.user = null; Store.set('session', null); App.go('/login'); },
      error(e) { return AUTH_ERR[e && e.code] || 'حدث خطأ، حاول مرة أخرى'; },
      // المعاينة داخل بانِي: حسابات تجريبية حقيقية على السحابة (بلا بريد فعلي)، لكل جهاز/تسجيل مستخدم مستقل
      async _preview(name, email) { const r = FS.auth.currentUser && FS.auth.currentUser.isAnonymous ? { user: FS.auth.currentUser } : await FS.a.signInAnonymously(FS.auth); try { await FS.a.updateProfile(r.user, { displayName: name }); } catch (e) {} Auth.user = { uid: r.user.uid, name: name || 'مستخدم تجريبي', email: email || '' }; Store.set('pv_user', Auth.user); return Auth.user; },
      _local(u) { Auth.user = { uid: u.uid, name: u.name, email: u.email }; Store.set('session', Auth.user); return Auth.user; },
      _set(u, name) { Auth.user = u ? { uid: u.uid, name: name || u.displayName || (u.email || '').split('@')[0], email: u.email } : null; return Auth.user; }
    };

    // ═════════════ الأدوار (عميل، بائع، مندوب...) ═════════════
    // صاحب التطبيق يوافق على الأدوار التي تحتاج موافقة من لوحة الإدارة ← الأعضاء
    const Roles = {
      list: META.roles || [], me: null,
      get multi() { return this.list.length > 1; },
      get base() { return this.list[0] ? this.list[0].id : 'user'; },
      info(id) { return this.list.find(r => r.id === id) || { id, name: id }; },
      current() { if (!this.multi) return this.base; const m = this.me; return m && m.status === 'ok' && this.list.some(r => r.id === m.role) ? m.role : this.base; },
      is(id) { return this.current() === id; },
      pending() { const m = this.me; return m && m.status === 'pending' ? m.role : null; },
      can(route) { const a = (META.access || {})[route]; return !a || !a.length || !this.multi || a.includes(this.current()); },
      home() { const n = META.nav.find(x => this.can(x.route)); return n ? n.route : '/'; },
      async load() {
        if (!this.multi || !Auth.user) { this.me = null; return; }
        try { this.me = await DB.get('members', Auth.user.uid); } catch (e) { this.me = Store.get('member_' + Auth.user.uid, null); }
        if (this.me) Store.set('member_' + Auth.user.uid, this.me);
      },
      async request(role) {
        const r = this.info(role), status = r.approve ? 'pending' : 'ok';
        const doc = { userId: Auth.user.uid, name: Auth.user.name || '', email: Auth.user.email || '', role, status, requestedAt: Date.now() };
        await DB.set('members', Auth.user.uid, doc);
        this.me = Object.assign({}, this.me || {}, doc); Store.set('member_' + Auth.user.uid, this.me);
        buildNav(); return status;
      },
      sheet(first) {
        const cur = this.me ? this.me.role : this.base;
        const sh = UI.sheet(`<h3>${first ? 'كيف ستستخدم ' + UI.esc(META.name) + '؟' : 'دورك في التطبيق'}</h3><p class="muted" style="margin:4px 0 14px">${first ? 'اختر دورك، ويمكنك تغييره لاحقاً' : 'الدور الحالي: ' + UI.esc(this.info(this.current()).name) + (this.pending() ? ' · طلب «' + UI.esc(this.info(this.pending()).name) + '» قيد المراجعة' : '')}</p>` +
          this.list.map(r => `<button class="role-opt${r.id === cur ? ' on' : ''}" data-role="${UI.esc(r.id)}"><span class="item-icon"><i data-lucide="${UI.esc(r.icon || 'user')}"></i></span><span style="flex:1;min-width:0"><b>${UI.esc(r.name)} ${r.approve ? '<span class="role-badge">بموافقة الإدارة</span>' : ''}</b><small>${UI.esc(r.does || '')}</small></span></button>`).join(''));
        App.on(sh, 'click', '[data-role]', async (e, b) => {
          const id = b.dataset.role;
          if (!first && id === this.current() && !this.pending()) return UI.closeSheet();
          UI.busy(b, true);
          try { const st = await this.request(id); UI.closeSheet(); UI.toast(st === 'ok' ? 'أهلاً بك كـ' + this.info(id).name : 'أُرسل طلبك، ستصلك الصلاحيات بعد موافقة الإدارة', st === 'ok' ? 'success' : 'info'); App.go(this.home()); }
          catch (err) { console.error(err); UI.toast('تعذّر الحفظ، حاول مرة أخرى', 'error'); UI.busy(b, false); }
        });
      },
      pill() {
        const p = document.getElementById('h-role'); if (!p) return;
        p.hidden = !this.multi || !Auth.user;
        if (!p.hidden) p.innerHTML = `<i data-lucide="${UI.esc(this.info(this.current()).icon || 'user')}"></i>${UI.esc(this.info(this.current()).name)}${this.pending() ? ' · قيد المراجعة' : ''}`;
      }
    };

    window.__banee = { get Roles(){ return Roles; }, get DB(){ return DB; }, get Store(){ return Store; }, get App(){ return App; }, get Auth(){ return Auth; },
      setRole(r) { Roles.me = r ? { role: r, status: 'ok' } : null; buildNav(); } };
    // ═════════════ التنقّل ═════════════
    const App = {
      screens: [], _leave: [],
      onLeave(fn) { this._leave.push(fn); },
      // يحصر قواعد الشاشة داخل حاويتها، ويرمي ما يمس الهيكل (العنوان، القائمة، الثابت، الألوان الثابتة)
      scopeCss(css, scope) {
        css = css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/@import[^;]*;?/gi, '').replace(/<\/?style[^>]*>/gi, '');
        return css.replace(/([^{}@]+)\{([^{}]*)\}/g, (all, sel, body) => {
          if (/html|\bbody\b|#app|app-header|bottom-nav|:root/i.test(sel)) return '';
          const b = body.split(';').filter(d => { const v = d.toLowerCase(); return d.indexOf(':') > 0 && !/position\s*:\s*(fixed|sticky)|url\(|!important|#[0-9a-f]{3,8}\b/.test(v); }).join(';');
          if (!b.trim()) return '';
          return sel.split(',').map(x => { x = x.trim(); return x === ':scope' || x === '&' ? scope : scope + ' ' + x.replace(/^&\s*/, ''); }).join(', ') + '{' + b + '}';
        });
      },
      screen(def) {
        def.keys = [];
        def.re = new RegExp('^' + def.route.replace(/:(\w+)/g, (_, k) => { def.keys.push(k); return '([^/]+)'; }) + '/?$');
        // شاشة من التطبيق بنفس مسار شاشة مدمجة (/login, /register) تحل محلها: صاحب التطبيق يصمم دخوله بنفسه
        const i = this.screens.findIndex(x => x.builtin && x.route === def.route);
        if (i > -1) { def.public = true; this.screens[i] = def; return; }
        this.screens.push(def);
      },
      match(path) {
        for (const s of this.screens) {
          const m = path.match(s.re);
          if (m) { const p = {}; s.keys.forEach((k, i) => { p[k] = decodeURIComponent(m[i + 1]); }); return [s, p]; }
        }
        return null;
      },
      go(path) { if (location.hash.slice(1) === path) App.render(); else location.hash = path; },
      back() { if (history.length > 1) history.back(); else App.go('/'); },
      on(root, event, selector, fn) { root.addEventListener(event, e => { const t = e.target.closest(selector); if (t && root.contains(t)) fn(e, t); }); },
      async render() {
        this._leave.splice(0).forEach(f => { try { f(); } catch (e) {} });
        UI.closeSheet();
        const path = location.hash.slice(1) || '/';
        const found = App.match(path) || App.match('/');
        if (!found) return;
        const [s, params] = found;
        if (META.auth && !s.public && !Auth.user) return App.go('/login');
        if (META.auth && s.public && Auth.user && (s.route === '/login' || s.route === '/register')) return App.go('/');
        if (!s.public && !Roles.can(s.route)) { const h = Roles.home(); if (h !== path) { if (path !== '/') UI.toast('هذه الصفحة غير متاحة لدورك الحالي', 'info'); return App.go(h); } }
        const main = document.getElementById('app');
        const el = document.createElement('div');
        el.className = 'screen'; el.dataset.scr = s.id || '';
        // تصميم خاص بالشاشة (الحقل css في App.screen): محصور داخلها فلا يمس بقية التطبيق
        let st = document.getElementById('scr-css'); if (!st) { st = document.createElement('style'); st.id = 'scr-css'; document.head.appendChild(st); }
        st.textContent = s.css ? App.scopeCss(String(s.css), '.screen[data-scr="' + (s.id || '') + '"]') : '';
        try { el.innerHTML = s.render(params); }
        catch (e) { console.error(e); el.innerHTML = UI.empty('alert-triangle', 'تعذّر عرض الشاشة', 'حاول مرة أخرى'); }
        main.replaceChildren(el); main.scrollTop = 0;
        const isAuth = s.route === '/login' || s.route === '/register';
        document.getElementById('h-title').textContent = isAuth ? META.name : s.title;
        document.getElementById('h-back').hidden = !!s.nav || isAuth || s.route === '/';
        document.getElementById('h-logout').hidden = !(META.auth && Auth.user && s.nav);
        document.body.classList.toggle('has-nav', !isAuth && META.nav.length > 1);
        document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === s.route));
        Roles.pill();
        UI.icons();
        if (s.mount) {
          try { const r = await s.mount(el, params); if (typeof r === 'function') App.onLeave(r); }
          catch (e) { console.error(e); UI.toast('تعذّر تحميل البيانات', 'error'); }
          UI.icons();
        }
      }
    };

    // ── حارس القراءة: نص بتباين ضعيف مع خلفيته الفعلية يتحول تلقائياً لنص داكن أو فاتح مقروء (شبكة أمان لما يفوت المصلح) ──
    const Readable = (() => {
      const rgb = v => { const m = String(v).match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(/[\s,\/]+/).filter(Boolean).map(parseFloat); return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 }; };
      const lum = c => [c.r, c.g, c.b].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }).reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0);
      const bgOf = el => { for (let e = el; e && e !== document.documentElement; e = e.parentElement) { const st = getComputedStyle(e); if (st.backgroundImage && st.backgroundImage !== 'none') return null; const c = rgb(st.backgroundColor); if (c && c.a > .85) return c; } return rgb(getComputedStyle(document.body).backgroundColor); };
      let t = 0;
      const run = () => {
        const root = document.getElementById('app'); if (!root) return;
        let n = 0;
        root.querySelectorAll('*').forEach(el => {
          if (n > 400 || el.dataset.rd) return;
          const own = [].some.call(el.childNodes, x => x.nodeType === 3 && x.textContent.trim()); if (!own) return; n++;
          const st = getComputedStyle(el), fg = rgb(st.color), bg = bgOf(el); if (!fg || !bg || fg.a < .5) return;
          const a = lum(fg), b = lum(bg), k = (Math.max(a, b) + .05) / (Math.min(a, b) + .05);
          if (k < 3) { el.style.color = b > .4 ? 'var(--text)' : '#FFFFFF'; el.dataset.rd = '1'; }
        });
      };
      return { check() { clearTimeout(t); t = setTimeout(run, 250); } };
    })();
    try { new MutationObserver(() => Readable.check()).observe(document.getElementById('app'), { childList: true, subtree: true }); } catch (e) {}

    // شاشات الدخول (مدمجة)
    if (META.auth) {
      const authForm = (reg) => `
        <div class="auth">
          <div class="auth-logo"><i data-lucide="${UI.esc(META.icon || 'sparkles')}"></i></div>
          <h2>${reg ? 'إنشاء حساب' : 'أهلاً بك'}</h2>
          <p>${UI.esc(META.summary || '')}</p>
          ${reg ? '<div class="field"><label class="label">الاسم</label><input class="input" id="f-name" autocomplete="name"></div>' : ''}
          <div class="field"><label class="label">البريد الإلكتروني</label><input class="input" id="f-email" type="email" dir="ltr" autocomplete="email"></div>
          <div class="field"><label class="label">كلمة المرور</label><input class="input" id="f-pass" type="password" dir="ltr" autocomplete="${reg ? 'new-password' : 'current-password'}"></div>
          <button class="btn btn-primary" data-act="submit">${reg ? 'إنشاء الحساب' : 'تسجيل الدخول'}</button>
          <div class="auth-switch">${reg ? 'لديك حساب؟' : 'ليس لديك حساب؟'} <button class="link" data-act="switch">${reg ? 'سجّل دخولك' : 'أنشئ حساباً'}</button></div>
        </div>`;
      const authMount = (reg) => (el) => {
        App.on(el, 'click', '[data-act=switch]', () => App.go(reg ? '/login' : '/register'));
        App.on(el, 'click', '[data-act=submit]', async (e, btn) => {
          const email = el.querySelector('#f-email').value.trim(), pass = el.querySelector('#f-pass').value;
          const name = reg ? el.querySelector('#f-name').value.trim() : '';
          if (!email || !pass || (reg && !name)) return UI.toast('أكمل جميع الحقول', 'error');
          UI.busy(btn, true);
          try { reg ? await Auth.signUp(name, email, pass) : await Auth.signIn(email, pass); await Roles.load(); buildNav(); App.go(Roles.home()); if (Roles.multi && !Roles.me) setTimeout(() => Roles.sheet(true), 400); }
          catch (err) { UI.toast(Auth.error(err), 'error'); }
          finally { UI.busy(btn, false); }
        });
      };
      App.screen({ id: 'login', route: '/login', title: 'تسجيل الدخول', public: true, builtin: true, render: () => authForm(false), mount: authMount(false) });
      App.screen({ id: 'register', route: '/register', title: 'إنشاء حساب', public: true, builtin: true, render: () => authForm(true), mount: authMount(true) });
    }

    // ═════════════ محرّك المواصفات: شاشات كاملة تُبنى من وصف قصير (Spec.screen) بلا كود، مجرَّبة ومتسقة ═════════════
    const Spec = (() => {
      const hasData = () => { try { return typeof Data !== 'undefined' && Data; } catch (e) { return null; } };
      const D = c => { const dd = hasData(); if (dd) return dd[c]; return { list: o => DB.list(c, o || {}), visible: o => DB.list(c, o || {}), mine: o => DB.list(c, o || {}), get: id => DB.get(c, id), create: o => DB.add(c, o), update: (id, p) => DB.update(c, id, p), remove: id => DB.remove(c, id), setStatus: (id, s) => DB.update(c, id, { status: s }), take: (id, s) => DB.update(c, id, s ? { status: s } : {}) }; };
      const lbl = s => { const dd = hasData(); return dd && dd.label ? dd.label(s) : s; };
      const val = (x, k) => k ? String(k).split('.').reduce((o, q) => o == null ? o : o[q], x) : undefined;
      const fmt = (v, kind) => { if (v == null || v === '') return ''; if (kind === 'money') return UI.money(v, (META.pay && META.pay.currency) || 'ج.س'); if (kind === 'date') return UI.date(v); if (kind === 'ago') return UI.ago(v); if (kind === 'num') return UI.num(v); if (kind === 'status') return lbl(v); if (Array.isArray(v)) return v.length + ''; if (typeof v === 'object') return ''; return String(v); };
      const tpl = (s, x, p) => String(s || '').replace(/:id\b/g, encodeURIComponent((x && x.id) || (p && p.id) || '')).replace(/\{(\w+(?:\.\w+)*)\}/g, (_, k) => encodeURIComponent(val(x, k) ?? val(p, k) ?? ''));
      const when = (w, x) => !w || Object.keys(w).every(k => [].concat(w[k]).map(String).includes(String(val(x, k) ?? '')));
      const badgeCls = v => /done|deliver|complet|paid|approv|accept|confirm|graded|active|ok/.test(String(v)) ? 'badge-success' : /cancel|reject|expir|absent|fail/.test(String(v)) ? 'badge-error' : 'badge-warning';
      const ACT = a => a.act || ('do-' + String(a.do || 'x').replace(/^status:/, '').replace(/^go:.*/, 'open').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, ''));
      async function rows(b, p) {
        const api = D(b.collection); if (!api) return [];
        let xs = b.show === 'all' ? await api.list({}) : b.show === 'mine' && api.mine ? await api.mine({}) : await (api.visible ? api.visible({}) : api.list({}));
        xs = (xs || []).slice();
        if (b.filter) xs = xs.filter(x => when(b.filter, x));
        if (b.byParam) xs = xs.filter(x => String(val(x, b.byParam)) === String(p && p.id));
        const sk = String(b.sort || '-createdAt'), dir = sk[0] === '-' ? -1 : 1, key = sk.replace(/^-/, '');
        xs.sort((a, c) => { const A = val(a, key), C = val(c, key); return (A > C ? 1 : A < C ? -1 : 0) * dir; });
        return b.limit ? xs.slice(0, b.limit) : xs;
      }
      const actBtns = (acts, x, small) => (acts || []).map((a, i) => when(a.when, x) ? `<button class="btn ${a.style === 'danger' ? 'btn-danger' : a.style === 'ghost' ? 'btn-ghost' : i ? 'btn-outline' : 'btn-primary'}${small ? ' btn-sm' : ''}" data-act="${UI.esc(ACT(a))}" data-id="${UI.esc(x.id || '')}" data-i="${i}">${a.icon ? `<i data-lucide="${UI.esc(a.icon)}"></i>` : ''}${UI.esc(a.label || 'تنفيذ')}</button>` : '').join('');
      async function run(a, col, x, p, redraw) {
        const api = D(col), d = String(a.do || '');
        if (a.confirm && !(await UI.confirm(a.confirm))) return;
        try {
          if (d.startsWith('go:')) return App.go(tpl(d.slice(3), x, p));
          if (d === 'take') await api.take(x.id, a.status);
          else if (d.startsWith('status:')) await api.setStatus(x.id, d.slice(7));
          else if (d === 'remove') await api.remove(x.id);
          else if (d.startsWith('set:')) { const kv = d.slice(4).split('='); await api.update(x.id, { [kv[0]]: kv[1] }); }
          UI.toast(a.done || 'تم', 'success');

              const title = sh.querySelector('#pn-t').value.trim(), body = sh.querySelector('#pn-b').value.trim(), route = sh.querySelector('#pn-r').value || '/';
              if (!title) return UI.toast('اكتب عنوان الإشعار', 'error');
              UI.busy(b, true);
              try {
                await DB.add('notices', { title, body, route, createdAt: Date.now() });
                let sent = 0; if (META.push) { const r = await Cloud.call({ op: 'push', appId: META.cloud.id, title, body, route }); if (!r.ok) throw new Error(r.error && r.error.message); sent = r.sent; }
                UI.closeSheet(); UI.toast(META.push ? 'أُرسل إلى ' + UI.num(sent) + ' جهاز، ويظهر داخل التطبيق للجميع' : 'سيظهر للمستخدمين عند فتح التطبيق', 'success');
              } catch (err) { UI.toast('تعذّر الإرسال: ' + (err.message || ''), 'error'); UI.busy(b, false); }
            });
          });
        } });

      if (Roles.multi) App.screen({ id: '__admin_members', route: '/admin-members', title: 'الأعضاء والأدوار', public: true,
        render: () => `<div class="section"><div class="hero"><h2>الأعضاء والأدوار</h2><p>وافق على طلبات الأدوار أو غيّر دور أي عضو</p></div></div><div class="section stack" id="mb-list">${UI.skeleton(3)}</div>`,
        async mount(el) {
          if (!guard(el)) return;
          const load = async () => {
            const all = (await DB.list('members').catch(() => [])).sort((a, b) => (a.status === 'pending' ? 0 : 1) - (b.status === 'pending' ? 0 : 1) || (b.requestedAt || 0) - (a.requestedAt || 0));
            el.querySelector('#mb-list').innerHTML = all.length ? all.map(m => `<div class="card" style="padding:12px"><div class="row" style="gap:8px;align-items:center"><b style="flex:1;min-width:0">${UI.esc(m.name || m.email || m.id)}</b>${m.status === 'pending' ? '<span class="role-badge">ينتظر الموافقة</span>' : ''}</div><p class="muted" style="margin:4px 0 10px;font-size:13px">${UI.esc(m.email || '')} · ${UI.esc(Roles.info(m.role).name)}</p><div class="row" style="gap:8px;flex-wrap:wrap">${m.status === 'pending' ? `<button class="btn btn-primary btn-sm" data-act="mb-ok" data-id="${UI.esc(m.id)}"><i data-lucide="check"></i>موافقة</button><button class="btn btn-ghost btn-sm" data-act="mb-no" data-id="${UI.esc(m.id)}">رفض</button>` : ''}<select class="input" data-act="mb-role" data-id="${UI.esc(m.id)}" style="flex:1;min-width:120px;height:36px">${Roles.list.map(r => `<option value="${UI.esc(r.id)}"${r.id === m.role ? ' selected' : ''}>${UI.esc(r.name)}</option>`).join('')}</select></div></div>`).join('') : UI.empty('users', 'لا يوجد أعضاء بعد', 'سيظهر هنا كل من يختار دوراً في التطبيق');
            UI.icons();
          };
          App.on(el, 'click', '[data-act=mb-ok]', async (e, b) => { UI.busy(b, true); await DB.update('members', b.dataset.id, { status: 'ok' }); UI.toast('تمت الموافقة', 'success'); load(); });
          App.on(el, 'click', '[data-act=mb-no]', async (e, b) => { UI.busy(b, true); await DB.update('members', b.dataset.id, { status: 'ok', role: Roles.base }); UI.toast('رُفض الطلب وعاد لدور ' + Roles.info(Roles.base).name, 'success'); load(); });
          App.on(el, 'change', '[data-act=mb-role]', async (e, s) => { await DB.update('members', s.dataset.id, { role: s.value, status: 'ok' }); UI.toast('تغيّر الدور', 'success'); load(); });
          await load();
        } });

      App.screen({ id: '__admin_col', route: '/admin/:col', title: 'الإدارة', public: true,
        render: p => `<div class="section"><div class="row"><h2 class="title" style="flex:1">${UI.esc(colLabel(p.col))}</h2><button class="btn btn-primary btn-sm" data-act="ad-new"><i data-lucide="plus"></i>إضافة</button></div><input class="input search" id="ad-q" placeholder="بحث..." style="margin-top:12px"></div><div class="section"><div id="ad-items" class="list">${UI.skeleton(4)}</div></div>`,
        async mount(el, p) {
          if (!guard(el)) return;
          const col = META.admin.collections.find(c => c.name === p.col) || { name: p.col, fields: {} };
          document.getElementById('h-title').textContent = colLabel(p.col);
          let items = [];
          const draw = () => {
            const q = el.querySelector('#ad-q').value.trim();
            const xs = q ? items.filter(x => JSON.stringify(x).includes(q)) : items;
            el.querySelector('#ad-items').innerHTML = xs.length ? xs.map(x => `<div class="item"><span class="item-body"><span class="item-title">${UI.esc(head(x))}</span><span class="item-sub">${p.col === 'orders' ? UI.esc((x.status || 'جديد') + (x.amount != null ? ' · ' + UI.money(x.amount, (META.pay && META.pay.currency) || 'ج.س') : '') + ' · ' + UI.date(x.createdAt)) : UI.date(x.createdAt)}</span></span><button class="icon-btn" data-act="ad-edit" data-id="${UI.esc(x.id)}" aria-label="تعديل"><i data-lucide="pencil"></i></button><button class="icon-btn" data-act="ad-del" data-id="${UI.esc(x.id)}" aria-label="حذف"><i data-lucide="trash-2"></i></button></div>`).join('') : UI.empty('inbox', 'لا توجد عناصر', 'أضف أول عنصر من زر الإضافة');
            UI.icons();
          };
          const load = async () => { items = await DB.list(p.col); items.sort((a, b) => ((a.order ?? 1e9) - (b.order ?? 1e9)) || ((b.createdAt || 0) - (a.createdAt || 0))); draw(); };
          const form = (x) => {
            const f = { ...(col.fields || {}) };
            if (x) Object.keys(x).forEach(k => { if (!(k in f)) f[k] = typeof x[k] === 'number' ? 'number' : typeof x[k] === 'boolean' ? 'boolean' : (x[k] && typeof x[k] === 'object' ? 'array' : 'string'); });
            const keys = Object.keys(f).filter(k => !['id', 'createdAt', 'updatedAt', 'userId'].includes(k));
            const kind = k => { const t = String(f[k]).toLowerCase(); return /bool/.test(t) ? 'bool' : /^(number|int|float|double)/.test(t) ? 'num' : /array|object|\{|\[/.test(t) ? 'json' : 'str'; };
            const field = k => {
              const v = x ? x[k] : undefined, t = kind(k), id = 'af-' + k;
              if (p.col === 'orders' && k === 'status') return `<div class="field"><label class="label">${label(k)}</label><select class="input" id="${id}">${STATUS.map(s => `<option${s === (v || 'جديد') ? ' selected' : ''}>${s}</option>`).join('')}</select></div>`;
              if (t === 'bool') return `<label class="row" style="gap:8px;margin:10px 0"><input type="checkbox" id="${id}"${v ? ' checked' : ''}> ${UI.esc(label(k))}</label>`;
              if (t === 'num') return `<div class="field"><label class="label">${UI.esc(label(k))}</label><input class="input" id="${id}" type="number" dir="ltr" value="${v ?? ''}"></div>`;
              if (t === 'json') return `<div class="field"><label class="label">${UI.esc(label(k))} <span class="muted">(JSON)</span></label><textarea class="input" id="${id}" rows="5" dir="ltr">${UI._e(v == null ? '' : JSON.stringify(v, null, 2))}</textarea></div>`;
              const long = /desc|body|content|summary|text|details|bio|about|answer|explan|note/i.test(k) || String(v || '').length > 70;
              return `<div class="field"><label class="label">${UI.esc(label(k))}</label>${long ? `<textarea class="input" id="${id}" rows="5">${UI._e(v ?? '')}</textarea>` : `<input class="input" id="${id}" value="${UI._e(v ?? '')}">`}</div>`;
            };
            const sh = UI.sheet(`<h3>${x ? 'تعديل' : 'إضافة'}: ${UI.esc(colLabel(p.col))}</h3><div style="max-height:60vh;overflow-y:auto;margin:8px 0">${keys.map(field).join('')}</div><div class="row"><button class="btn btn-ghost" data-r="0">إلغاء</button><button class="btn btn-primary" data-r="1">حفظ</button></div>`);
            App.on(sh, 'click', '[data-r]', async (e, b) => {
              if (b.dataset.r === '0') return UI.closeSheet();
              const data = {};
              for (const k of keys) {
                const inp = sh.querySelector('#af-' + k); if (!inp) continue;
                const t = kind(k);
                if (inp.type === 'checkbox') data[k] = inp.checked;
                else if (inp.tagName === 'SELECT') data[k] = inp.value;
                else if (t === 'num') data[k] = inp.value === '' ? null : Number(inp.value);
                else if (t === 'json') { if (!inp.value.trim()) { data[k] = []; continue; } try { data[k] = JSON.parse(inp.value); } catch (_) { return UI.toast('صيغة غير صحيحة في ' + label(k), 'error'); } }
                else data[k] = inp.value;
              }
              UI.busy(b, true);
              try {
                if (x) await DB.update(p.col, x.id, data);
                else { if (data.order == null && 'order' in f) data.order = items.length + 1; await DB.add(p.col, data); }
                UI.closeSheet(); UI.toast('تم الحفظ', 'success'); load();
              } catch (err) { UI.toast('تعذّر الحفظ: ' + (err.message || ''), 'error'); UI.busy(b, false); }
            });
          };
          el.querySelector('#ad-q').addEventListener('input', draw);
          App.on(el, 'click', '[data-act=ad-new]', () => form(null));
          App.on(el, 'click', '[data-act=ad-edit]', (e, b) => form(items.find(i => String(i.id) === b.dataset.id)));
          App.on(el, 'click', '[data-act=ad-del]', async (e, b) => { if (await UI.confirm('حذف هذا العنصر نهائياً؟', 'حذف', true)) { await DB.remove(p.col, b.dataset.id); UI.toast('حُذف', 'success'); load(); } });
          await load();
        } });
    }

    // ═════════════ التشغيل ═════════════
    function buildNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = META.nav.filter(n => Roles.can(n.route)).map(n => `<button class="nav-item${((location.hash.slice(1) || '/').split('?')[0] === n.route) ? ' active' : ''}" data-route="${UI.esc(n.route)}"><i data-lucide="${UI.esc(n.icon || 'circle')}"></i><span>${UI.esc(n.title)}</span></button>`).join('');
      if (!nav._wired) { nav._wired = true; App.on(nav, 'click', '.nav-item', (e, b) => App.go(b.dataset.route)); }
      document.body.classList.toggle('few-nav', nav.children.length < 2);
      UI.icons();
    }

    async function initFirebase() {
      if (!LIVE) return;
      const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
      const [appM, fsM, auM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
      const fbApp = META.preview ? appM.initializeApp(FIREBASE_CONFIG, 'pv_' + META.id) : appM.initializeApp(FIREBASE_CONFIG); // المعاينة: جلسة منفصلة عن حساب بانِي
      FS = { m: fsM, a: auM, db: fsM.getFirestore(fbApp), auth: auM.getAuth(fbApp) };
      // أول تشغيل (مشروع Firebase خاص فقط): ارفع المحتوى إذا كانت المجموعة فارغة. في سحابة بانِي يرفعه بانِي نفسه.
      if (!META.cloud) for (const [c, items] of Object.entries(META.seed || {})) {
        try {
          const snap = await fsM.getDocs(fsM.query(fsM.collection(FS.db, c), fsM.limit(1)));
          if (snap.empty) await Promise.all(items.map((x, i) => fsM.setDoc(fsM.doc(FS.db, c, String(x.id || 's' + (i + 1))), { createdAt: Date.now() - i * 1000, ...x })));
        } catch (e) { console.warn('seed', c, e.message); }
      }
      await new Promise(res => { const off = auM.onAuthStateChanged(FS.auth, u => { Auth._set(u, u && u.isAnonymous ? 'زائر' : ''); off(); res(); }); });
      if (META.preview && Auth.user) { const pv = Store.get('pv_user'); if (pv && pv.uid === Auth.user.uid) Auth.user = pv; else if (META.auth && FS.auth.currentUser && FS.auth.currentUser.isAnonymous && !pv) Auth.user = null; }
      if (META.preview) { const bn = document.createElement('div'); bn.className = 'pv-banner'; bn.textContent = 'قاعدة بيانات تجريبية حقيقية · تعمل داخل بانِي فقط'; document.body.appendChild(bn); }
      // تطبيق بلا تسجيل دخول: هوية مجهولة حتى تُحفظ بيانات كل جهاز على السحابة باسمه
      if (META.cloud && !META.auth && !Auth.user) {
        try { const r = await auM.signInAnonymously(FS.auth); Auth._set(r.user, 'زائر'); }
        catch (e) { console.warn('anon', e.code || e.message); }
      }
    }

    async function initAds() {
      try {
        const AdMob = window.Capacitor?.Plugins?.AdMob;
        if (!META.ads || !AdMob || !window.Capacitor.isNativePlatform()) return; // الإعلانات فقط إذا فعّلها صاحب التطبيق
        await AdMob.initialize({ initializeForTesting: AD_TEST });
        await AdMob.showBanner({ adId: AD_IDS.banner, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: 64, isTesting: AD_TEST });
      } catch (e) {}
    }

    function initBackButton() {
      const CapApp = window.Capacitor?.Plugins?.App;
      if (!CapApp) return;
      CapApp.addListener('backButton', () => {
        if (document.getElementById('sheet')) return UI.closeSheet();
        const p = location.hash.slice(1) || '/';
        if (p === '/' || p === '/login') CapApp.exitApp(); else history.back();
      });
    }

    document.getElementById('h-back').addEventListener('click', () => App.back());
    document.getElementById('h-logout').addEventListener('click', async () => { if (await UI.confirm('تسجيل الخروج من الحساب؟', 'خروج', true)) Auth.signOut(); });
    window.addEventListener('hashchange', () => App.render());

    (async () => {
      try { await initFirebase(); } catch (e) { console.error(e); LIVE = false; FS = null; UI.toast('لا يوجد اتصال، تعمل الآن بالبيانات المحفوظة', 'info'); }
      if (!LIVE) Auth.user = Store.get('session');
      if (META.test) Auth.user = { uid: 'test-user', name: 'مستخدم تجريبي', email: 'test@banee.app' };
      if (!META.auth && !Auth.user) {
        let g = Store.get('guest');
        if (!g) { g = { uid: 'guest-' + genId(), name: 'زائر', email: '' }; Store.set('guest', g); }
        Auth.user = g;
      }
      await Roles.load();
      buildNav();
      App.render();
      document.getElementById('h-role').addEventListener('click', () => Roles.sheet(false));
      // عند العودة للتطبيق: تحقق إن وافق صاحب التطبيق على الدور
      const roleRefresh = async () => { if (!Roles.multi || !Auth.user) return; const was = Roles.current(); await Roles.load(); if (Roles.current() !== was) { buildNav(); UI.toast('أصبحت الآن ' + Roles.info(Roles.current()).name, 'success'); App.go(Roles.home()); } else Roles.pill(); };
      document.addEventListener('visibilitychange', () => { if (!document.hidden) roleRefresh(); });
      window.__banee.refresh = roleRefresh;
      let inBanee = false; try { inBanee = window.parent !== window && !!window.parent.baneeAppCall; } catch (e) {}
      if (Roles.multi && Auth.user && !Roles.me && !META.test && !inBanee) setTimeout(() => Roles.sheet(true), 500);
      initAds(); initBackButton(); Push.init(); setTimeout(() => Push.notices(), 1200);
    })();
  </script>
</body>
</html>
